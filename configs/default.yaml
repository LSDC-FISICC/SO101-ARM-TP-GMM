# Default configuration for the SO-101 TP-GMM pipeline.
# Paths are relative to the repository root unless absolute.

dataset:
  repo_id: SebRivGar/dataset3
  revision: main
  local_dir: data/raw/dataset3
  state_key: observation.state        # follower joints (the leader `action` is NOT used)
  fixed_camera_key: observation.images.top
  wrist_camera_key: observation.images.wrist   # not used in this phase
  # Which video keys to download. The wrist camera is skipped to save ~0.8 GB.
  download_video_keys: [observation.images.top]

units:
  # "auto" infers the joint units from the quantization pattern and value ranges
  # (see so101_tpgmm/data/units.py). Set "degrees" or "range_m100_100" to force,
  # in which case the detector still runs and an inconsistency raises an error.
  joints: auto
  # Max absolute deviation (in motor ticks) tolerated by the quantization test.
  quantization_tol_ticks: 0.01

kinematics:
  urdf: so101_tpgmm/kinematics/urdf/so101_new_calib.urdf
  base_link: base_link
  tcp_link: gripper_frame_link
  joint_names: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll]
  joint_limits:
    # URDF limits are violated by the demonstrations themselves (rest pose shoulder_lift
    # -104.4 deg < -100 deg), so IK uses the union of URDF limits and the observed range.
    source: urdf_union_observed     # or: urdf
    margin_deg: 1.0
    observed_deg:                   # Phase 0: min/max of observation.state over all frames
      shoulder_pan: [-98.6, 84.2]
      shoulder_lift: [-105.1, 95.2]
      elbow_flex: [-94.0, 96.9]
      wrist_flex: [-3.6, 101.8]
      wrist_roll: [-53.1, 110.6]
  ik:
    pos_tol: 0.001          # [m] success tolerance
    yaw_tol_deg: 1.0        # success tolerance
    yaw_weight: 0.05        # [m/rad] residual scaling of the yaw error
    reg_weight: 0.001       # [m/rad] pull towards the previous posture (redundant DOF)
    min_yaw_observability: 0.2
    # Redundancy (5 joints, 4 task constraints): soft approach-pitch target, then a
    # task-priority polish so position/yaw are exact. Pitch = tilt of the approach axis
    # from straight down, + = leaning outward (demos: ~9 deg at grasp, ~27 deg near table).
    pitch_weight: 0.02      # [m/rad]
    default_pitch_deg: 15.0 # used when no pitch is supplied (null = no pitch term)
  # Centre of a grasped cube expressed in the TCP (gripper_frame_link) frame [m].
  # PRELIMINARY: jointly fitted with the pixel->XY homography (Phase 0, docs/dataset_report.md §6).
  # Lowers the homography error 10.6 -> 8.4 mm; bootstrap 95% CI ~ +-2-5 mm per axis.
  grasp_offset_tcp: [-0.0075, -0.0172, -0.0169]

scene:
  cube_side: 0.04            # [m] measured
  # Fixed camera placement as measured on the real setup (approximate).
  camera_height_above_table: 0.55   # [m] measured (~)
  camera_footprint_from_pan_axis: 0.24   # [m] assumed until measured; must be > 0.14
  camera_stand_from_robot_base: 0.46     # [m] measured by tape (to the stand base)

grid:
  # Blue floor tape: lanes side by side; INNER dimensions measured on the real setup.
  n_lanes: 4
  lane_width: 0.10           # [m] inner
  lane_length: 0.40          # [m] inner
  tape_width_guess: 0.02     # [m] estimated by the fit
  exclude_boxes: [[440, 0, 640, 115]]   # pixel boxes to ignore (the box occludes a corner)

camera:
  # From the taped grid (scripts/calibrate_camera_grid.py -> docs/camera_calibration.md,
  # full extrinsics in outputs/camera_calibration.yaml). Principal point assumed at the
  # image centre; the lens footprint is sensitive to it (+-2 cm per 20 px).
  image_size: [640, 480]
  focal_px: 496
  lens_position_base: [0.356, 0.013, 0.546]   # [m] base frame
  optical_axis_tilt_deg: 9.4

gripper:
  # Gripper values are in LeRobot RANGE_0_100 (0 = calibrated min = closed).
  # Three regimes were observed in Phase 0 (docs/dataset_report.md):
  #   closed-empty ~0-12, holding a cube ~17-23 (jaws stop on the cube), open >= ~25.
  open_threshold: 25.5      # rising above this => OPEN (some approaches open only to ~27)
  close_threshold: 23.5     # falling below this => CLOSED (hold plateau p99 = 22.2)
  hold_min: 13.0            # a closed plateau in [hold_min, close_threshold] = holding a cube
  min_hold_s: 0.4           # minimum duration of a holding plateau
  min_open_s: 0.15          # minimum duration of an OPEN interval (debounce)
  smooth_window: 5          # median filter window (frames, odd)
  plateau_tol: 1.5          # |g - plateau| tolerance used to place contact/release instants

segmentation:
  # Cycles = OPEN -> HOLD -> OPEN (gripper section) + physical gates; primitives:
  # approach_grasp [start, contact], transport_release [contact, release complete].
  grasp_max_z: 0.03          # [m] TCP z at contact must be at table height (no stacking)
  release_min_z: 0.03        # [m] release must happen above the table (box)
  onset_joint_speed_deg_s: 5.0
  onset_min_s: 0.2           # motion must be sustained this long to count as onset
  keypoint_height: 0.03      # [m] pre-grasp / lift keypoints: z_contact + this
  min_primitive_s: 0.5
  quiet_release_tail_s: 0.3  # P2 end after a release without a detectable opening
  output_csv: outputs/segmentation.csv

vision:
  # Fixed camera only. HSV in OpenCV units (H 0-179, S/V 0-255); ranges set from the
  # measured cube statistics (Phase 3 report). Red wraps around 0/180: two intervals.
  colors:
    red:    {hue: [[0, 10], [170, 179]], min_s: 120, min_v: 50}
    yellow: {hue: [[18, 35]], min_s: 120, min_v: 50}
    green:  {hue: [[40, 90]], min_s: 120, min_v: 50}
    # No blue cube appears in this dataset; the floor tape is blue (S ~110, V ~96).
    # Keep a high value floor so tape is rejected; the shape filters reject strips.
    blue:   {hue: [[100, 130]], min_s: 150, min_v: 130}
  area_px: [900, 2600]       # cube blobs measured 1167-1721 px (p1-p99)
  max_aspect: 1.6            # minAreaRect long/short side
  min_fill: 0.6              # blob area / minAreaRect area
  open_kernel: 3
  close_kernel: 5
  exclude_boxes: [[440, 0, 640, 115], [250, 400, 410, 480]]   # box (yellow object inside), camera stand
  # Calibration view (median background of dataset3's first frames): scripts/infer.py aligns the taped
  # grid of each photo to it and corrects the homography if the camera moved (so101_tpgmm/vision/register.py).
  reference_image: configs/reference_top.jpg
  intrinsics: null           # optional {K: [[fx,0,cx],[0,fy,cy],[0,0,1]], dist: [k1,k2,p1,p2,k3]}
  scene:
    reference_margin_frames: 2       # reference frame = motion onset - this
    home_tolerance_m: 0.05           # TCP vs median home TCP (rest posture varies, TCP within ~3 cm)
    static_window_s: 0.5
    static_diff_threshold: 40
    static_max_fraction: 0.002
    arm_home_roi_px: [265, 0, 375, 135]
    expected_area_ratio: [0.7, 2.0]  # blob area / (cube side in px)^2
  calibration:
    ransac_threshold: 0.015  # [m]
    fit_tcp_offset: true
    output: outputs/vision_calibration.yaml
  association_max_distance: 0.03     # [m] detected cube <-> FK grasp position
  # Vision (reference frame) vs FK cube centre at contact: larger => the gripper pushed the
  # cube before closing, the demo is inconsistent with the initial cube frame -> not usable.
  max_vision_fk_error_mm: 20
  frames_csv: outputs/cube_frames.csv

tpgmm:
  # Input: normalized time t in [0, 1]; outputs: TCP position, outward jaw heading h,
  # gripper, approach pitch (the extra output lets the IK follow the demonstrated posture).
  outputs: [x, y, z, h, g, pitch]
  samples_per_primitive: 50    # resampling of every demonstration (equal weight per demo)
  exclude_aborted: true        # drop cycles with a missed/aborted grasp inside the approach
  frames:
    cube_source: vision        # vision (default, matches execution) | fk (cube centre at contact)
    box:
      mode: estimate           # estimate = mean release TCP position | fixed
      position: [0.057, 0.164, 0.082]   # used when mode: fixed [m, base frame]
      yaw_deg: 0.0
  k_range: [3, 4, 5, 6, 7, 8, 10, 12]   # BIC model selection
  max_iter: 200
  # Diagonal regularization of every covariance (variances): t, x, y, z, h, g, pitch.
  # t: (0.032)^2 smooths GMR transitions between components (roughness /4, grasp error unchanged);
  # position (2 mm)^2, angles (2 deg)^2, gripper (1 unit)^2.
  reg: [1.0e-3, 4.0e-6, 4.0e-6, 4.0e-6, 1.2e-3, 1.0, 1.2e-3]
  primitives: [approach_grasp, transport_release]
  boundary_blend: 0.3          # fraction of a primitive used to blend its start into the previous end
  models_dir: outputs/models

evaluation:
  n_folds: 100               # held-out cycles for leave-one-out (stratified); 'all' for every cycle
  workers: 4

inference:
  policy: segmented          # segmented | monolithic | ik_planner
  color_order: [red, yellow, green, blue]
  home_joints_deg: [-5.7, -104.3, 91.3, 76.3, 2.8]   # median rest posture of the demonstrations
  home_gripper: 1.5
  # Gripper command sent to the follower. The TP-GMM learned the follower's *measured* gripper, which
  # sits at ~20 while holding because the 4 cm cube stops the jaws; the operator's leader meanwhile
  # commanded ~0.8 (median over 400 cycles, p75 10). Sending 20 puts the jaws exactly on the cube with
  # no position error, so the servo does not squeeze and the cube is not lifted. Below contact_level the
  # command becomes hold_command; between contact_level and release_level it is interpolated (no jump);
  # above release_level the plan's value is sent unchanged.
  gripper_command: {contact_level: 20.0, release_level: 26.0, hold_command: 2.0}
  return_home_s: 2.0         # joint-space return to home between cubes
  dt: 0.0333                 # 30 Hz, like the dataset
  require_full_ik: true      # skip a cube if any trajectory point has no IK solution
  # Cube 90-degree symmetry: when the two best equivalent yaws are within this margin of the
  # decision boundary, plan both and keep the IK-feasible one with least joint motion.
  ambiguity_margin_deg: 10.0
  output_dir: outputs/inference

inspection:
  output_report: docs/dataset_report.md
  figures_dir: docs/figures
  n_video_check_episodes: 8   # episodes whose first/last frame is decoded and checked
  camera_bootstrap: 60        # bootstrap resamples for the camera-geometry uncertainty

grasp_check:
  # Verify each grasp and replan a missed cube (so101_tpgmm/grasp.py; docs/grasp_check.md). Measured on
  # dataset3: follower - leader gripper while holding median 19.1; closed empty, 0.5 s after closing,
  # median 0.7, max 6.6 (0.17 s after: up to 41, the jaws are still moving).
  settle_s: 0.5             # wait after the gripper command reaches its hold value
  min_margin: 8.0           # measured - commanded gripper with the cube between the jaws
  hold_range: [12.0, 40.0]  # plausible measured gripper on a 4 cm cube
  max_retries: 2            # replans per cube after a miss
  retreat_height_m: 0.06    # straight lift after a miss, before going home
  open_gripper: 40.0        # open to this after a miss
  wrist:                    # optional confirmation with the wrist camera (dataset3: holding p5 0.43, empty 0.00)
    roi: [0.33, 0.35, 0.67, 0.90]   # x0, y0, x1, y1 as fractions of the wrist image
    min_blob: 0.15                  # largest cube-coloured blob / ROI area

sim:
  # MuJoCo simulation (scripts/simulate_mujoco.py). Robot: official SO-101 MJCF, fetched by
  # scripts/fetch_so101_mujoco.sh into robot_dir.
  robot_dir: third_party/so101_mujoco
  # Table top in the FK base frame, as a plane z = a + b x + c y: the lowest finger point at the
  # demonstrated grasps, fitted over the workspace (residual 5.7 mm), minus 1 cm. In FK coordinates
  # the real (flat) table looks tilted (~3.4 deg, lower far from the robot) and ~2.5 cm below the
  # tape-grid estimate (-0.4 cm): that is the joint-calibration error of the FK. In simulation what
  # matters is that the table and the commanded joints are consistent.
  table_plane: [-0.0112, -0.059, 0.004]
  grasp_assist: false        # true: weld a cube touched by both fingers while the gripper is closed
  cube_mass: 0.03            # [kg] (not measured)
  cube_friction: 1.2
  finger_friction: 1.5
  # Open container. Its size was NOT measured: 12 x 12 cm inner holds every demonstrated release
  # (cube at release: median (5.75, 18.3) cm, p5-p95 +-2.2 cm) with 1-3.6 cm to spare, extends away
  # from the grasped cubes, and leaves >= 1.7 cm between its walls and any demonstrated cube.
  box:
    center_xy: [0.045, 0.19]
    inner: [0.12, 0.12]
    wall_h: 0.045
    wall_t: 0.005
  n_cubes: 3
  colors: [red, yellow, green]
  min_separation: 0.08       # [m] between cube centres
  box_clearance: 0.04        # [m] sampled cube centre to box wall (outer face), beyond half a cube
  sample_radius: 0.02        # cube xy = a demonstrated cube position + uniform disc of this radius
  # Variant --box-slots: release the k-th cube at the training box frame + these offsets [m], i.e. in its
  # own slot of the box (cube landing points (7.8, 15.8), (2.3, 15.8), (5.0, 21.8) cm: >= 5.5 cm apart).
  box_slots: [[0.020, -0.025], [-0.035, -0.025], [-0.0075, 0.035]]

rl:
  # SAC on the pick-and-place task (scripts/train_sac.py), same interface in MuJoCo and on the robot.
  agent_hz: 10               # agent decisions per second; joint commands interpolated to 30 Hz
  # Action (all in [-1, 1]):
  #   scratch:  dx, dy, dz (x max_step_m, cumulative target), dyaw (x max_yaw_step_deg), gripper (absolute 0..gripper_max)
  #   residual: offsets from the TP-GMM plan: xyz (x residual_m), yaw (x residual_yaw_deg), gripper (x residual_gripper)
  max_step_m: 0.02
  max_yaw_step_deg: 15
  gripper_max: 60
  residual_m: 0.01
  residual_yaw_deg: 8
  # Residual gripper: 0 = the gripper follows the TP-GMM. A constant +0.3 x 30 = +9 units while holding
  # leaves the jaws wider than the cube and drops it (2/20 successes vs 20/20): a cliff next to the
  # nominal command that the first residual runs fell into. Position/yaw corrections are benign.
  residual_gripper: 0
  residual_action_penalty: 0.2   # reward -= this x mean(a^2): depart from the TP-GMM only where it pays off
  # Commanded-target safety box in the base frame [m] (z relative to the table plane)
  workspace_min: [0.05, -0.25, 0.008]   # z: height above the table plane (sim.table_plane)
  workspace_max: [0.45, 0.30, 0.25]
  horizon_s: {scratch: 15.0, residual_extra: 2.0}   # residual: TP-GMM plan duration + extra
  # Observed cube pose: a snapshot at the start of the episode (like the fixed camera), with noise
  cube_obs_noise_mm: 3.0
  cube_obs_noise_yaw_deg: 3.0
  domain_randomization:      # per episode, in simulation
    table_offset_mm: 4.0
    cube_mass_kg: [0.02, 0.06]
    cube_friction: [0.8, 1.5]
    servo_kp_scale: [0.8, 1.2]
  models_dir: outputs/models/sac
  # Real robot: the camera pipeline gives the cube in the training convention (biased ~2 cm w.r.t. the
  # fingers); the RL policies observe the cube centre between the fingers, as in simulation. Offset
  # finger midpoint - vision position at the demonstrated grasps, in the grasp heading frame (368
  # cycles, MAD 4.6 mm). Set to [0, 0] once the camera is calibrated directly in the FK frame.
  vision_to_finger_heading_mm: [13.7, 15.1]
  real:
    max_tracking_err_deg: 25   # abort the episode (collision / stall) when measured vs commanded exceeds this
    holding_gripper: [12, 35]  # measured gripper while commanded closed: jaws stopped by a cube (grasp proxy)
    holding_margin: 3          # measured - commanded gripper above this = blocked by an object
